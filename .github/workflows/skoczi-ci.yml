name: Game Panel PRO CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npm test && npm run build
        working-directory: backend
      - run: npm run test:docker
        working-directory: backend
        env:
          GAMEPANEL_DOCKER_TEST: '1'
      - run: npm ci --ignore-scripts && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:ui
        working-directory: frontend
      - name: Validate deployment shell syntax
        run: find deploy -name '*.sh' -exec bash -n {} \;
      - run: python3 -B deploy/agent/test_agent.py
  nodes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: backend
      - name: Build actual agent runtime
        run: docker build -f backend/Dockerfile -t gamepanel-agent:ci .
      - name: Test two independent runtimes on real Docker
        working-directory: backend
        run: npx tsx --test test/integration/nodes.test.ts
        env:
          GAMEPANEL_NODE_DOCKER_TEST: '1'
