server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Static application assets only. API responses are served by the backend.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~* "^/assets/.+-[a-zA-Z0-9_-]{8,}\.(js|css|woff2?|ttf)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
